<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Payslip Sender{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <span>Payslip Sender</span>
    {% if current_user %}
    <form method="post" action="/logout">
      {{ csrf_input(request) }}
      <span class="who">Signed in as {{ current_user.username }}</span>
      <button type="submit" class="link">Log out</button>
    </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
