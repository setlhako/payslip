{% extends "base.html" %}
{% block title %}Log in - Payslip Sender{% endblock %}
{% block page %}
<div class="login">
  <main id="main" class="login-card">
    <div class="inner">
      <div class="login-brand"><span class="mark" aria-hidden="true"></span><span class="brand-name">Payslip Sender</span></div>
      <h1>Log in</h1>
      {% if error %}
      <div class="callout callout-error" role="alert">{{ icon('x-circle') }}<div class="callout-text">{{ error }}</div></div>
      {% endif %}
      {% include "_flash.html" %}
      <form method="post" action="/login" autocomplete="off" data-once>
        {{ csrf_input(request) }}
        <div class="field">
          <label for="username">Username</label>
          <input class="input" type="text" id="username" name="username" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>
    </div>
  </main>
</div>
{% endblock %}
